# AeroSpace — the macOS stand-in for sway. Bindings follow .config/sway/config
# with $mod = Cmd, the Super key of the Mac. Where sway has a second key for the
# same action the Cmd one is left to the apps (⌘T, ⌘F, ⌘V, ⌘arrows); the rest that would
# take an everyday app shortcut (⌘W, ⌘S, ⌘−, ⌘=) get Ctrl added.

config-version = 2

start-at-login = true

# like sway: an empty workspace goes away once you leave it
persistent-workspaces = []

# window borders, colored by dotstyle (theme/templates/borders.sh.tpl)
after-startup-command = ['exec-and-forget sh ~/workspace/dotfiles/theme/current/borders.sh']

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']

# cmd+h would otherwise hide windows AeroSpace can no longer tile
automatically-unhide-macos-hidden-apps = true

[key-mapping]
preset = 'qwerty'

# exec-and-forget gets launchd's bare PATH otherwise
[exec]
inherit-env-vars = true
[exec.env-vars]
PATH = '/opt/homebrew/bin:/opt/homebrew/sbin:/Users/ren/.nix-profile/bin:/nix/var/nix/profiles/default/bin:${PATH}'

# gaps inner 16 from sway.conf (sway puts them at the screen edges too)
[gaps]
inner.horizontal = 16
inner.vertical = 16
outer.left = 16
outer.bottom = 16
outer.top = 16
outer.right = 16

[mode.main.binding]
# launch apps
cmd-enter = 'exec-and-forget sh ~/.config/aerospace/ghostty-window.sh'
cmd-b = 'exec-and-forget open -a Zen'
# bluetui / wiremix -> their System Settings panes
cmd-shift-b = 'exec-and-forget open x-apple.systempreferences:com.apple.BluetoothSettings'
cmd-shift-a = 'exec-and-forget open x-apple.systempreferences:com.apple.Sound-Settings.extension'

# dot-lock: the same as the system's ctrl-cmd-q (display sleep alone would only
# lock after the screen-lock delay)
cmd-alt-l = """exec-and-forget osascript -e 'tell application "System Events" to keystroke "q" using {control down, command down}'"""
# sway's $mod+Shift+e logout; macOS asks to confirm
cmd-shift-e = """exec-and-forget osascript -e 'tell application "System Events" to log out'"""

# kill
cmd-q = 'close'
cmd-shift-q = 'close'

# focus
cmd-h = 'focus left'
cmd-j = 'focus down'
cmd-k = 'focus up'
cmd-l = 'focus right'

# move
cmd-shift-h = 'move left'
cmd-shift-j = 'move down'
cmd-shift-k = 'move up'
cmd-shift-l = 'move right'

# move workspace to output left / right
cmd-ctrl-shift-h = 'move-workspace-to-monitor --wrap-around prev'
cmd-ctrl-shift-l = 'move-workspace-to-monitor --wrap-around next'

# workspaces
cmd-1 = 'workspace 1'
cmd-2 = 'workspace 2'
cmd-3 = 'workspace 3'
cmd-4 = 'workspace 4'
cmd-5 = 'workspace 5'
cmd-6 = 'workspace 6'
cmd-7 = 'workspace 7'
cmd-8 = 'workspace 8'
cmd-9 = 'workspace 9'

cmd-shift-1 = 'move-node-to-workspace 1'
cmd-shift-2 = 'move-node-to-workspace 2'
cmd-shift-3 = 'move-node-to-workspace 3'
cmd-shift-4 = 'move-node-to-workspace 4'
cmd-shift-5 = 'move-node-to-workspace 5'
cmd-shift-6 = 'move-node-to-workspace 6'
cmd-shift-7 = 'move-node-to-workspace 7'
cmd-shift-8 = 'move-node-to-workspace 8'
cmd-shift-9 = 'move-node-to-workspace 9'

# fullscreen
cmd-shift-f = 'fullscreen'

# layout: e toggles split, w/s are the accordion take on tabbed/stacking
cmd-e = 'layout tiles horizontal vertical'
cmd-ctrl-w = 'layout accordion horizontal'
cmd-ctrl-s = 'layout accordion vertical'

# floating
cmd-shift-space = 'layout floating tiling'

# resize
cmd-ctrl-minus = 'resize width -50'
cmd-ctrl-equal = 'resize width +50'
cmd-ctrl-shift-minus = 'resize height -50'
cmd-ctrl-shift-equal = 'resize height +50'

cmd-shift-c = 'reload-config'

# --- Window rules (sway's for_window ... floating enable) ---
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.calculator'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

# Raycast is the rofi stand-in ($mod+d = ⌘D is its own hotkey, set in Raycast);
# keep its settings window out of the tiling
[[on-window-detected]]
if.app-id = 'com.raycast.macos'
run = 'layout floating'
