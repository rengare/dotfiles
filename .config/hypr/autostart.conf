exec-once = dbus-update-activation-environment --systemd DISPLAY WAYLAND_DISPLAY HYPRLAND_INSTANCE_SIGNATURE XDG_CURRENT_DESKTOP XDG_SESSION_TYPE DESKTOP_SESSION
exec-once = systemctl --user start graphical-session.target
exec-once = /usr/libexec/xdg-desktop-portal-hyprland &
# polkit-mate, not polkit-gnome — matches what sway starts, and what
# dot-kill's PROTECTED table actually protects (bin/dot-kill's
# `polkit-mate-aut` entry).
exec-once = /usr/libexec/polkit-mate-authentication-agent-1 &
exec-once = nm-applet &
exec-once = blueman-applet &
exec-once = waybar &
exec-once = hyprpm reload -n
# Wallpaper, nightlight, idle timeline, clipboard watcher, foot server,
# flameshot and resume-from-suspend: all one call, same as
# `exec_always dot-session restart` in theme/templates/sway.conf.tpl. This is
# also what theme/apply calls explicitly after `hyprctl reload`, since
# exec-once (unlike sway's exec_always) does not re-run on a Hyprland reload.
exec-once = dot-session restart
exec-once = gsettings set org.gnome.desktop.interface font-name 'Noto Sans 11'
exec-once = gsettings set org.gnome.desktop.interface document-font-name 'Noto Sans 11'
exec-once = gsettings set org.gnome.desktop.interface monospace-font-name 'JetBrains Mono 11'
exec-once = gsettings set org.gnome.desktop.interface gtk-theme 'Adwaita-dark'
exec-once = gsettings set org.gnome.desktop.interface color-scheme 'prefer-dark'
