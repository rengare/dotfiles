# See https://wiki.hyprland.org/Configuring/Keywords/
#
# Bound bind-for-bind against .config/sway/config (the live daily-driver
# config — not .config/i3/config, which is stale): every dot-* call sway
# makes, Hyprland makes the same call. hy3's tree dispatchers are what stand
# in for sway's native tree — there is no sway binding to match those
# against, hy3 *is* how Hyprland gets that behavior.
$mainMod = SUPER # Sets "Windows" key as main modifier

# --- Launch apps ---
bind = $mainMod, Return, exec, dot-terminal
bind = $mainMod, T, exec, dot-terminal
bind = $mainMod SHIFT, B, exec, dot-terminal -e bluetui
bind = $mainMod SHIFT, A, exec, dot-terminal -e wiremix -v output
bind = $mainMod, D, exec, rofi -show combi
bind = $mainMod SHIFT, D, exec, dot-menu
bind = $mainMod ALT, L, exec, dot-lock
bind = $mainMod, B, exec, $browser

# --- Close window ---
bind = $mainMod SHIFT, Q, hy3:killactive,
bind = $mainMod, Q, hy3:killactive,

# --- Focus (vim) ---
bind = $mainMod, h, hy3:movefocus, l
bind = $mainMod, l, hy3:movefocus, r
bind = $mainMod, k, hy3:movefocus, u
bind = $mainMod, j, hy3:movefocus, d
bind = $mainMod, left, hy3:movefocus, l
bind = $mainMod, right, hy3:movefocus, r
bind = $mainMod, up, hy3:movefocus, u
bind = $mainMod, down, hy3:movefocus, d

# --- Move windows (vim) ---
bind = $mainMod SHIFT, h, hy3:movewindow, l
bind = $mainMod SHIFT, l, hy3:movewindow, r
bind = $mainMod SHIFT, k, hy3:movewindow, u
bind = $mainMod SHIFT, j, hy3:movewindow, d
bind = $mainMod SHIFT, left, hy3:movewindow, l
bind = $mainMod SHIFT, right, hy3:movewindow, r
bind = $mainMod SHIFT, up, hy3:movewindow, u
bind = $mainMod SHIFT, down, hy3:movewindow, d

# --- Move workspace to monitor --- (sway: move workspace to output)
bind = $mainMod CTRL SHIFT, h, movecurrentworkspacetomonitor, l
bind = $mainMod CTRL SHIFT, l, movecurrentworkspacetomonitor, r

# --- Workspaces ---
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
# 0 -> 10 has no sway equivalent (sway only goes to 9) — kept anyway, it does
# not shadow anything.
bind = $mainMod, 0, workspace, 10

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# --- Fullscreen ---
bind = $mainMod, f, fullscreen
bind = $mainMod SHIFT, F, fullscreen

# --- Layout (hy3) --- matches sway's $mod+e/w/s (toggle split / tabbed / stacking)
bind = $mainMod, E, hy3:changegroup, opposite       # toggle h<->v split (Sway: $mod+e layout toggle split)
bind = $mainMod, W, hy3:makegroup, tab              # tabbed group      (Sway: $mod+w layout tabbed)
bind = $mainMod, S, hy3:makegroup, v                # vertical group    (Sway: $mod+s layout stacking)
bind = $mainMod, G, hy3:changegroup, toggletab      # toggle tab on existing group (no sway equivalent, harmless extra)
bind = $mainMod ALT, E, hy3:expand, expand
bind = $mainMod ALT SHIFT, E, hy3:expand, base

# --- Floating --- (sway: $mod+shift+space / $mod+v floating toggle)
bind = $mainMod SHIFT, SPACE, togglefloating,
bind = $mainMod, V, togglefloating,
# sway's $mod+space is "focus mode_toggle" (swap keyboard focus between the
# floating and tiled layers) — Hyprland has no matching dispatcher, so this
# stays hy3's float-height toggle rather than guessing at a wrong one.
bind = $mainMod, SPACE, hy3:togglefloatheight,

# --- Resize --- (sway: $mod±minus/equal width, $mod+shift±minus/equal height, 10px)
bind = $mainMod, minus, resizeactive, -10 0
bind = $mainMod, equal, resizeactive, 10 0
bind = $mainMod SHIFT, minus, resizeactive, 0 -10
bind = $mainMod SHIFT, equal, resizeactive, 0 10
# No sway equivalent — a faster resize step, harmless extra.
bind = $mainMod CTRL, h, resizeactive, -20 0
bind = $mainMod CTRL, l, resizeactive, 20 0
bind = $mainMod CTRL, k, resizeactive, 0 -20
bind = $mainMod CTRL, j, resizeactive, 0 20

# --- Screenshots --- (sway: Print/dot-shot, ctrl+Print/dot-capture screen, alt+Print/dot-capture window)
bind = , PRINT, exec, dot-shot
bind = CTRL, PRINT, exec, dot-capture screen
bind = ALT, PRINT, exec, dot-capture window

# --- Volume --- (sway: dot-volume up/down/mute/mic-mute)
bindel = , XF86AudioRaiseVolume, exec, dot-volume up
bindel = , XF86AudioLowerVolume, exec, dot-volume down
bindel = , XF86AudioMute, exec, dot-volume mute
bindel = , XF86AudioMicMute, exec, dot-volume mic-mute

# --- Brightness --- (sway: dot-brightness up/down)
bindel = , XF86MonBrightnessUp, exec, dot-brightness up
bindel = , XF86MonBrightnessDown, exec, dot-brightness down

# --- Keyboard backlight --- (sway: dot-kbd-backlight up/down/cycle)
bindel = , XF86KbdBrightnessUp, exec, dot-kbd-backlight up
bindel = , XF86KbdBrightnessDown, exec, dot-kbd-backlight down
bindel = , XF86KbdLightOnOff, exec, dot-kbd-backlight cycle

# --- Media --- (no sway equivalent — harmless extra)
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# --- Display toggle --- (sway: $mod+shift+o/p -> toggle-edp.sh/toggle-external.sh)
bind = $mainMod SHIFT, O, exec, ~/.config/hypr/scripts/toggle-edp.sh
bind = $mainMod SHIFT, P, exec, ~/.config/hypr/scripts/toggle-external.sh

# --- Zoom (output scale) --- (sway: $mod+alt+m/n -> sway-zoom in/out)
bind = $mainMod ALT, M, exec, ~/.config/hypr/scripts/hyprctl-zoom in
bind = $mainMod ALT, N, exec, ~/.config/hypr/scripts/hyprctl-zoom out

# --- Session --- (sway: $mod+shift+e -> loginctl terminate-user; ctrl+alt+Delete -> exit)
bind = $mainMod SHIFT, E, exec, loginctl terminate-user $USER
bind = CTRL ALT, Delete, exit,

# --- Reload --- (sway: $mod+shift+c reload, $mod+shift+r restart; Hyprland has
# no separate "restart" so both map to reload)
bind = $mainMod SHIFT, C, exec, hyprctl reload
bind = $mainMod SHIFT, R, exec, hyprctl reload

# --- Misc --- (no sway equivalent — pre-existing, harmless extras)
bind = $mainMod, O, exec, foot --app-id mybtop -e btop
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod SHIFT, COMMA, exec, dunstctl close-all

# --- Mouse binds --- (sway gets the drag/resize half of this for free from
# `floating_modifier $mod`; Hyprland needs it spelled out)
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
