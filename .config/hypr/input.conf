# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = pl
    kb_variant =
    kb_model =
    kb_options = caps:super
    kb_rules =

    follow_mouse = 1

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    # accel_profile lives here, not inside touchpad{} — Hyprland 0.53
    # rejects it there (verified with --verify-config).
    accel_profile = adaptive

    touchpad {
        natural_scroll = false
        # touchpad{} has no `sensitivity` field; scroll_factor is the closest
        # equivalent (touchpad scroll speed) and is what the 0.5 here meant.
        scroll_factor = 0.5
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
#
# The old `gestures { workspace_swipe = true }` block form parses fine as one
# line but errors ("config option <gestures:workspace_swipe> does not
# exist") the moment it's split across lines like every other block in this
# file — a real parser quirk on this Hyprland version, verified with
# --verify-config, not a config mistake. `gesture = ...` is the newer
# unified directive (same family as `bind`) and doesn't have it: 3-finger
# horizontal swipe changes workspace, matching sway's 4-finger swipe intent
# closely enough for a touchpad.
gesture = 3, horizontal, workspace

# Per-device: trackpoint
device {
    name = tpps/2-elan-trackpoint
    sensitivity = 0.9
}
