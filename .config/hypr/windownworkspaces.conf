# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules
#
# Hyprland 0.53 replaced the old one-line `windowrule = RULE, selector:value`
# form entirely with this block form (`match:*` selectors, named action
# keys) — verified against this machine's installed version with
# `Hyprland --verify-config`, since the wiki examples floating around still
# show the removed one-liner syntax.

# Ignore maximize requests from apps.
windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

# Fix some dragging issues with XWayland
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# --- Workspace assignments ---
windowrule {
    name = firefox-workspace
    match:class = (firefox)
    workspace = 1
}
windowrule {
    name = btop-workspace
    match:class = ^(mybtop)$
    workspace = 6
}
windowrule {
    name = gimp-workspace
    match:class = (gimp)
    workspace = 3
}
windowrule {
    name = inkscape-workspace
    match:class = (org.inkscape.Inkscape)
    workspace = 3
}

# --- Floating rules (from Sway) ---
windowrule {
    name = float-pip
    match:title = ^(Picture-in-Picture)$
    float = yes
}
windowrule {
    name = float-yad
    match:class = (Yad)
    float = yes
}
windowrule {
    name = float-galculator
    match:class = (galculator)
    float = yes
}
windowrule {
    name = float-blueberry
    match:class = (blueberry.py)
    float = yes
}
windowrule {
    name = float-pavucontrol
    match:class = (pavucontrol)
    float = yes
}

# --- Tiling rules ---
windowrule {
    name = tile-wezterm
    match:class = (org.wezfurlong.wezterm)
    float = no
}

# --- Flameshot (XWayland fullscreen workaround) ---
windowrule {
    name = flameshot
    match:class = (flameshot)
    match:title = (flameshot)
    move = 0 0
    pin = yes
    fullscreen_state = 0 0
    float = yes
}
