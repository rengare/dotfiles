# COSMIC has no gesture bindings of its own (cosmic-comp#315, cosmic-epoch#1367).
# It handles only 4-finger left/right (workspaces), so 3 fingers are free here.
# Directions mirror sway's `bindgesture swipe:3:*`: the content follows the fingers.
gesture swipe right 3 wtype -P Super_L -P h -p h -p Super_L
gesture swipe left  3 wtype -P Super_L -P l -p l -p Super_L
