# Generated by dotstyle from theme/templates/sway.conf.tpl — do not edit.
# Included from .config/sway/config. Keybindings live there and are never
# touched by theming.

gaps inner 16
default_border pixel 4
default_floating_border pixel 4

#                       border            background        text              indicator         child_border
client.focused          #e68e0d #e68e0d #121212 #e68e0d #e68e0d
client.focused_inactive #333333 #333333 #bebebe #333333 #333333
client.unfocused        #333333 #333333 #555555 #333333 #333333
client.urgent           #D35F5F #D35F5F #121212 #D35F5F #D35F5F
client.placeholder      #121212 #121212 #bebebe #121212 #121212
client.background       #121212

# Noctalia draws the bar. A bar block is still required — without one sway
# starts a default swaybar — so declare one that never shows and never runs.
# The old dot-swaybar/dot-bar block is in sway.conf.tpl.pre-noctalia.
bar {
    mode invisible
    swaybar_command true
}

# --- Session daemons ---
# One line, because sway's config lexer strips quotes before handing the command
# to sh, which mangles anything with nested quoting. dot-session restarts the
# idle daemon and the clipboard watcher, each guarded so
# that exec_always re-running on every reload cannot stack duplicates.
exec_always dot-session restart
